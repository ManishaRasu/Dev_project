name: Build and Test Docker App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  COMPOSE_PROJECT_NAME: tailmate
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Environment Check
        run: |
          echo "=== System Information ==="
          docker --version
          docker compose version
          node --version
          npm --version
          which docker compose

      - name: Create .env file
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET || 'your-secret-key' }}" > .env
          echo "NODE_ENV=development" >> .env
          cat .env

      - name: Build Docker Images
        run: docker compose build --no-cache
        timeout-minutes: 20

      - name: Cleanup previous containers
        if: always()
        run: |
          docker compose down --volumes --remove-orphans 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

      - name: Start Services
        run: |
          echo "Starting services with docker compose..."
          docker compose up -d
          echo "Waiting 45 seconds for services to be healthy..."
          sleep 45
        timeout-minutes: 5

      - name: Service Status
        if: always()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose ps
          echo ""
          echo "=== Service Health ==="
          docker compose exec -T mongodb mongosh --version || echo "MongoDB not ready"
          echo ""
          echo "=== Container Logs ==="
          docker compose logs --tail=50

      - name: Health Checks
        run: |
          echo "=== Checking Server Health (localhost:5000) ==="
          MAX_ATTEMPTS=15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✓ Server is healthy!"
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS - Server not ready, waiting..."
            sleep 3
            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "✗ Server health check failed"
              docker compose logs server
              exit 1
            fi
          done
          
          echo ""
          echo "=== Checking Client Health (localhost:3000) ==="
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✓ Client is healthy!"
              break
            fi
            echo "Attempt $i/10 - Client not ready, waiting..."
            sleep 3
          done
        continue-on-error: true
        timeout-minutes: 5

      - name: Install npm dependencies
        run: npm install

      - name: Run Tests
        run: |
          echo "Running npm tests..."
          npm test -- --watchAll=false --testMatch='**/*.test.js' 2>&1 || true
        continue-on-error: true
        timeout-minutes: 10

      - name: Final Status and Logs
        if: always()
        run: |
          echo "=== Final Docker Compose Status ==="
          docker compose ps || echo "Docker compose unavailable"
          echo ""
          echo "=== Service Logs (All) ==="
          docker compose logs || echo "Could not retrieve logs"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up resources..."
          docker compose down --volumes --remove-orphans 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint 2>&1 || true
        continue-on-error: true

      - name: Security Audit
        run: npm audit --audit-level=moderate 2>&1 || true
        continue-on-error: true
